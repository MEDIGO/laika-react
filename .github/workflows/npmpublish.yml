name: Publish Package

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Build project
        run: make build

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test

      - name: Publish package
        if: ${{ env.NPM_TOKEN != '' }}
        run: make publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish package (legacy token fallback)
        if: ${{ env.NPM_TOKEN == '' }}
        run: make publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_AUTH_TOKEN }}
